<svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
      @keyframes rise { 0%{transform:translateY(0)} 100%{transform:translateY(-6px)} }
      .p1{animation:pulse 2s ease-in-out infinite}
      .p2{animation:pulse 2.6s ease-in-out infinite 0.4s}
      .p3{animation:pulse 2.2s ease-in-out infinite 0.8s}
      .bar1{animation:rise 1.8s ease-in-out infinite alternate}
      .bar2{animation:rise 2.2s ease-in-out infinite alternate 0.3s}
      .bar3{animation:rise 1.6s ease-in-out infinite alternate 0.6s}
    </style>
  </defs>
  <rect width="200" height="160" fill="#1a0533"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.07">
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="50" y1="0" x2="50" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="160"/>
  </g>
  <!-- Chart bars -->
  <g class="bar1"><rect x="28" y="90" width="22" height="50" rx="3" fill="#FF2D78" opacity="0.9"/></g>
  <g class="bar2"><rect x="62" y="70" width="22" height="70" rx="3" fill="#FF7A1A" opacity="0.9"/></g>
  <g class="bar3"><rect x="96" y="50" width="22" height="90" rx="3" fill="#9B5CF6" opacity="0.9"/></g>
  <rect x="130" y="60" width="22" height="80" rx="3" fill="#00C896" opacity="0.7"/>
  <!-- Trend line -->
  <polyline points="39,110 73,88 107,62 141,72" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <circle cx="39" cy="110" r="3" fill="#FF2D78"/>
  <circle cx="73" cy="88" r="3" fill="#FF7A1A"/>
  <circle cx="107" cy="62" r="3" fill="#9B5CF6"/>
  <circle cx="141" cy="72" r="3" fill="#00C896"/>
  <!-- Person icon top right -->
  <circle cx="168" cy="32" r="10" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
  <circle cx="168" cy="29" r="4" fill="#ffffff" opacity="0.5"/>
  <path d="M160,42 Q168,36 176,42" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
  <!-- Label -->
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#ffffff" opacity="0.35" x="10" y="152" letter-spacing="1">DIGITAL CONSULTING</text>
</svg>
