<svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes slide { 0%{transform:translateX(0)} 50%{transform:translateX(4px)} 100%{transform:translateX(0)} }
      .cur{animation:blink 1.1s step-end infinite}
      .sl{animation:slide 2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="200" height="160" fill="#0a1628"/>
  <!-- Phone frame -->
  <rect x="68" y="8" width="64" height="112" rx="10" fill="#111d35" stroke="#3B8BD4" stroke-width="1.5"/>
  <!-- Notch -->
  <rect x="88" y="12" width="24" height="6" rx="3" fill="#0a1628"/>
  <!-- Screen content -->
  <rect x="72" y="22" width="56" height="92" rx="4" fill="#0d2040"/>
  <!-- Status bar dots -->
  <circle cx="82" cy="27" r="2" fill="#00C896"/>
  <circle cx="89" cy="27" r="2" fill="#FF7A1A" opacity="0.6"/>
  <!-- App header bar -->
  <rect x="72" y="31" width="56" height="14" fill="#1a3560"/>
  <rect x="76" y="35" width="28" height="4" rx="2" fill="#3B8BD4" opacity="0.7"/>
  <!-- UI Cards -->
  <rect x="76" y="50" width="48" height="18" rx="3" fill="#1e3f6e"/>
  <rect x="79" y="54" width="12" height="10" rx="2" fill="#FF2D78" opacity="0.8"/>
  <rect x="94" y="55" width="24" height="3" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="94" y="61" width="16" height="2" rx="1" fill="#ffffff" opacity="0.25"/>
  <rect x="76" y="72" width="48" height="18" rx="3" fill="#1e3f6e"/>
  <rect x="79" y="76" width="12" height="10" rx="2" fill="#9B5CF6" opacity="0.8"/>
  <rect x="94" y="77" width="24" height="3" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="94" y="83" width="18" height="2" rx="1" fill="#ffffff" opacity="0.25"/>
  <!-- Bottom nav -->
  <rect x="72" y="98" width="56" height="16" fill="#112040"/>
  <circle cx="84" cy="106" r="3" fill="#3B8BD4"/>
  <circle cx="100" cy="106" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="116" cy="106" r="3" fill="#ffffff" opacity="0.3"/>
  <!-- Home bar -->
  <rect x="86" y="116" width="28" height="3" rx="1.5" fill="#3B8BD4" opacity="0.5"/>
  <!-- Cursor blink -->
  <rect class="cur" x="72" y="35" width="1.5" height="8" fill="#3B8BD4"/>
  <!-- Floating elements left -->
  <rect x="12" y="30" width="40" height="6" rx="3" fill="#FF2D78" opacity="0.15"/>
  <rect x="12" y="40" width="30" height="4" rx="2" fill="#FF2D78" opacity="0.1"/>
  <rect x="12" y="50" width="35" height="4" rx="2" fill="#FF2D78" opacity="0.08"/>
  <!-- Floating elements right -->
  <rect x="148" y="30" width="40" height="6" rx="3" fill="#9B5CF6" opacity="0.15"/>
  <rect x="158" y="40" width="30" height="4" rx="2" fill="#9B5CF6" opacity="0.1"/>
  <rect x="153" y="50" width="35" height="4" rx="2" fill="#9B5CF6" opacity="0.08"/>
  <!-- Label -->
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#ffffff" opacity="0.35" x="10" y="152" letter-spacing="1">APP DESIGN</text>
</svg>
