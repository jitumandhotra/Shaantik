  <text font-family="'Courier New',monospace" font-size="7" fill="#00C896" x="60" y="46"> class=</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#FF7A1A" x="102" y="46">"hero"</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#FF2D78" x="136" y="46">&gt;</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#9B5CF6" x="26" y="58">  const</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#ffffff" x="63" y="58" opacity="0.8"> brand</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#FF2D78" x="95" y="58"> =</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#00C896" x="107" y="58"> new</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#FF7A1A" x="127" y="58"> Him();</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#9B5CF6" x="26" y="70">  return</text>
  <text font-family="'Courier New',monospace" font-size="7" fill="#ffffff" x="68" y="70" opacity="0.8"> impact;</text>
