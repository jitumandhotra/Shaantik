<svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes ripple { 0%{r:10;opacity:0.7} 100%{r:50;opacity:0} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      .rip1{animation:ripple 2s ease-out infinite}
      .rip2{animation:ripple 2s ease-out infinite 0.6s}
      .rip3{animation:ripple 2s ease-out infinite 1.2s}
      .fl{animation:float 3s ease-in-out infinite}
    </style>
  </defs>
  <rect width="200" height="160" fill="#1a0c00"/>
  <!-- Ripple waves from megaphone -->
  <circle class="rip1" cx="118" cy="76" r="10" fill="none" stroke="#FF7A1A" stroke-width="1"/>
  <circle class="rip2" cx="118" cy="76" r="10" fill="none" stroke="#FF2D78" stroke-width="0.8"/>
  <circle class="rip3" cx="118" cy="76" r="10" fill="none" stroke="#FFD700" stroke-width="0.6"/>
  <!-- Megaphone body -->
  <g class="fl">
    <polygon points="55,60 55,92 80,92 110,110 110,42 80,60" fill="#FF7A1A" opacity="0.95"/>
    <rect x="48" y="63" width="10" height="26" rx="3" fill="#FF2D78"/>
    <path d="M110,52 Q130,45 140,76 Q130,107 110,100" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M110,60 Q124,55 132,76 Q124,97 110,92" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Floating stat bubbles -->
  <rect x="130" y="18" width="52" height="22" rx="6" fill="#FF2D78" opacity="0.15" stroke="#FF2D78" stroke-width="0.8"/>
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="700" fill="#FF2D78" x="137" y="32" letter-spacing="0.5">+142% reach</text>
  <rect x="138" y="108" width="44" height="22" rx="6" fill="#00C896" opacity="0.15" stroke="#00C896" stroke-width="0.8"/>
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="700" fill="#00C896" x="143" y="123" letter-spacing="0.5">3.2M views</text>
  <rect x="10" y="18" width="36" height="22" rx="6" fill="#9B5CF6" opacity="0.15" stroke="#9B5CF6" stroke-width="0.8"/>
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="700" fill="#9B5CF6" x="15" y="32" letter-spacing="0.5">ROI 9x</text>
  <rect x="8" y="108" width="40" height="22" rx="6" fill="#FF7A1A" opacity="0.15" stroke="#FF7A1A" stroke-width="0.8"/>
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="700" fill="#FF7A1A" x="13" y="122" letter-spacing="0.5">CTR 18%</text>
  <!-- Label -->
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#ffffff" opacity="0.35" x="10" y="152" letter-spacing="1">MARKETING CAMPAIGN</text>
</svg>
