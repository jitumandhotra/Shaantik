<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <style>
          @keyframes rocketLaunch { 0%{transform:translate(0,0)} 50%{transform:translate(10px,-12px)} 100%{transform:translate(0,0)} }
          @keyframes flame { 0%,100%{transform:scaleY(1);opacity:0.9} 50%{transform:scaleY(1.4);opacity:0.6} }
          @keyframes barGrow1 { 0%{height:0;y:160} 100%{height:60;y:100} }
          @keyframes barGrow2 { 0%{height:0;y:160} 100%{height:90;y:70} }
          @keyframes barGrow3 { 0%{height:0;y:160} 100%{height:120;y:40} }
          @keyframes barGrow4 { 0%{height:0;y:160} 100%{height:150;y:10} }
          @keyframes lineTrace { 0%{stroke-dashoffset:300} 100%{stroke-dashoffset:0} }
          @keyframes starPop { 0%{opacity:0;transform:scale(0)} 70%{transform:scale(1.3)} 100%{opacity:1;transform:scale(1)} }
          .rl{animation:rocketLaunch 3s ease-in-out infinite;transform-origin:320px 120px}
          .fl{animation:flame 0.4s ease-in-out infinite;transform-origin:320px 160px}
          .bg1{animation:barGrow1 2s ease-out forwards 0.2s}
          .bg2{animation:barGrow2 2s ease-out forwards 0.5s}
          .bg3{animation:barGrow3 2s ease-out forwards 0.8s}
          .bg4{animation:barGrow4 2s ease-out forwards 1.1s}
          .lt{stroke-dasharray:300;animation:lineTrace 2s ease-out forwards 0.5s}
          .sp1{animation:starPop 0.5s ease forwards 2s;opacity:0}
          .sp2{animation:starPop 0.5s ease forwards 2.5s;opacity:0}
          .sp3{animation:starPop 0.5s ease forwards 3s;opacity:0}
        </style>
      </defs>

      <rect width="500" height="200" fill="#0a0820"/>
      <!-- Starfield -->
      <g fill="#ffffff">
        <circle cx="20" cy="15" r="0.8" opacity="0.6"/><circle cx="55" cy="35" r="1" opacity="0.4"/>
        <circle cx="90" cy="10" r="0.6" opacity="0.7"/><circle cx="140" cy="28" r="0.8" opacity="0.5"/>
        <circle cx="200" cy="8" r="1" opacity="0.6"/><circle cx="250" cy="22" r="0.6" opacity="0.4"/>
        <circle cx="450" cy="12" r="0.8" opacity="0.6"/><circle cx="480" cy="30" r="0.6" opacity="0.5"/>
        <circle cx="35" cy="55" r="0.6" opacity="0.4"/><circle cx="70" cy="70" r="0.8" opacity="0.3"/>
        <circle cx="470" cy="55" r="0.7" opacity="0.5"/><circle cx="490" cy="80" r="0.5" opacity="0.4"/>
      </g>

      <!-- Growth chart LEFT half -->
      <!-- Bar chart -->
      <g opacity="0.85">
        <rect class="bg1" x="30" y="100" width="30" height="60" rx="4" fill="#FF2D78"/>
        <rect class="bg2" x="75" y="70" width="30" height="90" rx="4" fill="#FF7A1A"/>
        <rect class="bg3" x="120" y="40" width="30" height="120" rx="4" fill="#9B5CF6"/>
        <rect class="bg4" x="165" y="10" width="30" height="150" rx="4" fill="#00C896"/>
      </g>
      <!-- Trend line over bars -->
      <polyline class="lt" points="45,100 90,70 135,40 180,10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="45" cy="100" r="3.5" fill="#FF2D78"/>
      <circle cx="90" cy="70" r="3.5" fill="#FF7A1A"/>
      <circle cx="135" cy="40" r="3.5" fill="#9B5CF6"/>
      <circle cx="180" cy="10" r="3.5" fill="#00C896"/>
      <!-- X axis -->
      <line x1="18" y1="165" x2="215" y2="165" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>
      <text font-family="Arial,sans-serif" font-size="7" fill="#ffffff" opacity="0.35" x="30" y="176">Q1</text>
      <text font-family="Arial,sans-serif" font-size="7" fill="#ffffff" opacity="0.35" x="75" y="176">Q2</text>
      <text font-family="Arial,sans-serif" font-size="7" fill="#ffffff" opacity="0.35" x="120" y="176">Q3</text>
      <text font-family="Arial,sans-serif" font-size="7" fill="#ffffff" opacity="0.35" x="165" y="176">Q4</text>

      <!-- Metric pills -->
      <rect x="18" y="182" width="52" height="14" rx="4" fill="#FF2D78" opacity="0.15" stroke="#FF2D78" stroke-width="0.6"/>
      <text font-family="Arial Black,Arial" font-size="7" font-weight="900" fill="#FF2D78" x="44" y="192" text-anchor="middle">+142% traffic</text>
      <rect x="78" y="182" width="52" height="14" rx="4" fill="#00C896" opacity="0.15" stroke="#00C896" stroke-width="0.6"/>
      <text font-family="Arial Black,Arial" font-size="7" font-weight="900" fill="#00C896" x="104" y="192" text-anchor="middle">ROI 9.4x</text>
      <rect x="138" y="182" width="52" height="14" rx="4" fill="#9B5CF6" opacity="0.15" stroke="#9B5CF6" stroke-width="0.6"/>
      <text font-family="Arial Black,Arial" font-size="7" font-weight="900" fill="#9B5CF6" x="164" y="192" text-anchor="middle">88% retention</text>

      <!-- Divider -->
      <line x1="230" y1="10" x2="230" y2="190" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

      <!-- ROCKET right half -->
      <g class="rl">
        <!-- Rocket body -->
        <ellipse cx="320" cy="100" rx="18" ry="46" fill="#1a1a2e" stroke="#9B5CF6" stroke-width="1.5"/>
        <!-- Nose cone -->
        <path d="M302,75 Q320,30 338,75 Z" fill="#9B5CF6" opacity="0.9"/>
        <!-- Windows -->
        <circle cx="320" cy="95" r="8" fill="#0a0820" stroke="#3B8BD4" stroke-width="1.5"/>
        <circle cx="320" cy="95" r="5" fill="#3B8BD4" opacity="0.4"/>
        <!-- Fins -->
        <path d="M302,130 L288,155 L302,145 Z" fill="#FF2D78" opacity="0.8"/>
        <path d="M338,130 L352,155 L338,145 Z" fill="#FF2D78" opacity="0.8"/>
        <!-- Flame -->
        <g class="fl">
          <path d="M308,146 Q320,170 332,146 Q326,158 320,162 Q314,158 308,146Z" fill="#FF7A1A" opacity="0.9"/>
          <path d="M312,146 Q320,160 328,146 Q324,154 320,157 Q316,154 312,146Z" fill="#FFD700" opacity="0.8"/>
        </g>
      </g>

      <!-- Exhaust trail -->
      <path d="M320,162 Q315,175 310,190" stroke="#FF7A1A" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
      <path d="M320,162 Q325,178 328,192" stroke="#FF7A1A" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>

      <!-- Stars popping around rocket -->
      <g class="sp1"><text font-family="Arial" font-size="14" fill="#FFD700" x="355" y="75">✦</text></g>
      <g class="sp2"><text font-family="Arial" font-size="10" fill="#FF2D78" x="268" y="65">✦</text></g>
      <g class="sp3"><text font-family="Arial" font-size="16" fill="#00C896" x="360" y="120">✦</text></g>

      <!-- Orbit ring around rocket -->
      <ellipse cx="320" cy="100" rx="60" ry="20" fill="none" stroke="#9B5CF6" stroke-width="0.8" opacity="0.25" stroke-dasharray="4 6" transform="rotate(-15 320 100)"/>

      <!-- Analytics panel right -->
      <rect x="400" y="20" width="88" height="160" rx="10" fill="#0f0f25" stroke="#3B8BD4" stroke-width="0.8" opacity="0.8"/>
      <text font-family="Arial Black,Arial" font-size="6" font-weight="900" fill="#3B8BD4" x="444" y="36" text-anchor="middle" letter-spacing="1">ANALYTICS</text>
      <line x1="408" y1="42" x2="480" y2="42" stroke="#3B8BD4" stroke-width="0.5" opacity="0.3"/>

      <text font-family="Arial,sans-serif" font-size="6" fill="#ffffff" opacity="0.5" x="414" y="58">Sessions</text>
      <text font-family="Arial Black,Arial" font-size="11" font-weight="900" fill="#00C896" x="414" y="72">24.8K</text>
      <line x1="408" y1="78" x2="480" y2="78" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>

      <text font-family="Arial,sans-serif" font-size="6" fill="#ffffff" opacity="0.5" x="414" y="94">Conversion</text>
      <text font-family="Arial Black,Arial" font-size="11" font-weight="900" fill="#FF7A1A" x="414" y="108">8.4%</text>
      <line x1="408" y1="114" x2="480" y2="114" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>

      <text font-family="Arial,sans-serif" font-size="6" fill="#ffffff" opacity="0.5" x="414" y="130">Bounce rate</text>
      <text font-family="Arial Black,Arial" font-size="11" font-weight="900" fill="#FF2D78" x="414" y="144">↓ 32%</text>
      <line x1="408" y1="150" x2="480" y2="150" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>

      <text font-family="Arial,sans-serif" font-size="6" fill="#ffffff" opacity="0.5" x="414" y="166">Revenue</text>
      <text font-family="Arial Black,Arial" font-size="9" font-weight="900" fill="#9B5CF6" x="414" y="178">↑ 3.2x</text>

      <!-- Step badge -->
      <rect x="243" y="10" width="34" height="22" rx="5" fill="#FF2D78"/>
      <text font-family="Arial Black,Arial" font-size="10" font-weight="900" fill="#ffffff" x="260" y="25" text-anchor="middle">04</text>
      <text font-family="Arial Black,Arial" font-size="8" font-weight="900" fill="#ffffff" x="284" y="25" opacity="0.8" letter-spacing="0.5">LAUNCH &amp; GROW</text>
    </svg>