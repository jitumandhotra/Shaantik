<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <style>
          @keyframes drawLine { 0%{stroke-dashoffset:400} 100%{stroke-dashoffset:0} }
          @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }
          .dl{stroke-dasharray:400;animation:drawLine 3s ease-in-out infinite alternate}
          .cur{animation:cursor 1s step-end infinite}
          @keyframes gridFade { 0%,100%{opacity:0.08} 50%{opacity:0.2} }
          .gf{animation:gridFade 3s ease-in-out infinite}
        </style>
      </defs>

      <rect width="240" height="200" fill="#001420"/>
      <!-- Grid lines — blueprint feel -->
      <g class="gf" stroke="#3B8BD4" stroke-width="0.5">
        <line x1="0" y1="25" x2="240" y2="25"/><line x1="0" y1="50" x2="240" y2="50"/>
        <line x1="0" y1="75" x2="240" y2="75"/><line x1="0" y1="100" x2="240" y2="100"/>
        <line x1="0" y1="125" x2="240" y2="125"/><line x1="0" y1="150" x2="240" y2="150"/>
        <line x1="0" y1="175" x2="240" y2="175"/>
        <line x1="30" y1="0" x2="30" y2="200"/><line x1="60" y1="0" x2="60" y2="200"/>
        <line x1="90" y1="0" x2="90" y2="200"/><line x1="120" y1="0" x2="120" y2="200"/>
        <line x1="150" y1="0" x2="150" y2="200"/><line x1="180" y1="0" x2="180" y2="200"/>
        <line x1="210" y1="0" x2="210" y2="200"/>
      </g>

      <!-- Wireframe — phone outline -->
      <rect x="75" y="30" width="90" height="148" rx="10" fill="none" stroke="#3B8BD4" stroke-width="1.5" opacity="0.8"/>
      <rect x="82" y="45" width="76" height="118" rx="4" fill="#001e30" stroke="#3B8BD4" stroke-width="0.8" opacity="0.6"/>
      <!-- Notch -->
      <rect x="103" y="34" width="34" height="5" rx="2.5" fill="#3B8BD4" opacity="0.5"/>
      <!-- Home bar -->
      <rect x="104" y="170" width="32" height="3" rx="1.5" fill="#3B8BD4" opacity="0.4"/>

      <!-- Wireframe UI elements inside phone -->
      <rect x="88" y="52" width="64" height="10" rx="2" fill="none" stroke="#FF2D78" stroke-width="1"/>
      <rect x="88" y="68" width="42" height="24" rx="2" fill="none" stroke="#3B8BD4" stroke-width="0.8"/>
      <rect x="136" y="68" width="16" height="24" rx="2" fill="none" stroke="#3B8BD4" stroke-width="0.8"/>
      <rect x="88" y="98" width="64" height="8" rx="2" fill="none" stroke="#9B5CF6" stroke-width="0.8"/>
      <rect x="88" y="112" width="64" height="8" rx="2" fill="none" stroke="#9B5CF6" stroke-width="0.8" opacity="0.6"/>
      <rect x="88" y="126" width="64" height="8" rx="2" fill="none" stroke="#9B5CF6" stroke-width="0.8" opacity="0.4"/>
      <rect x="96" y="140" width="48" height="18" rx="4" fill="none" stroke="#FF2D78" stroke-width="1"/>

      <!-- Animated draw path overlaying the wireframe -->
      <path class="dl" d="M75,30 Q75,20 85,30 L155,30 Q165,30 165,40 L165,168 Q165,178 155,178 L85,178 Q75,178 75,168 Z" fill="none" stroke="#FF2D78" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Cursor dot -->
      <circle class="cur" cx="165" cy="178" r="4" fill="#FF2D78"/>

      <!-- Dimension markers -->
      <line x1="170" y1="30" x2="170" y2="178" stroke="#FFD700" stroke-width="0.7" opacity="0.5"/>
      <line x1="167" y1="30" x2="173" y2="30" stroke="#FFD700" stroke-width="0.7" opacity="0.5"/>
      <line x1="167" y1="178" x2="173" y2="178" stroke="#FFD700" stroke-width="0.7" opacity="0.5"/>
      <text font-family="Courier New,monospace" font-size="6" fill="#FFD700" x="174" y="108" opacity="0.7">148px</text>

      <!-- Step badge -->
      <rect x="10" y="10" width="34" height="22" rx="5" fill="#FF2D78"/>
      <text font-family="Arial Black,Arial" font-size="10" font-weight="900" fill="#ffffff" x="27" y="25" text-anchor="middle">02</text>
      <!-- Label bottom -->
      <text font-family="Arial Black,Arial" font-size="7" font-weight="900" fill="#ffffff" x="12" y="190" opacity="0.7" letter-spacing="0.5">DESIGN &amp; PROTOTYPE</text>
    </svg>