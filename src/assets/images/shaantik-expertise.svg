<svg width="520" height="660" viewBox="0 0 520 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="520" height="660"/>
    </clipPath>
    <style>
      @keyframes orbit1 { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes orbit2 { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
      @keyframes pulse  { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes dash   { to{stroke-dashoffset:-24} }
      .ring1{animation:orbit1 18s linear infinite;transform-origin:260px 330px}
      .ring2{animation:orbit2 24s linear infinite;transform-origin:260px 330px}
      .pulse1{animation:pulse 2.8s ease-in-out infinite}
      .pulse2{animation:pulse 3.4s ease-in-out infinite 0.6s}
      .pulse3{animation:pulse 2.2s ease-in-out infinite 1.2s}
      .pulse4{animation:pulse 3.8s ease-in-out infinite 0.3s}
      .dline{animation:dash 1.8s linear infinite;stroke-dasharray:4 4}
    </style>
  </defs>

