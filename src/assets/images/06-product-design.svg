<svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes draw { 0%{stroke-dashoffset:300} 100%{stroke-dashoffset:0} }
      @keyframes glow { 0%,100%{opacity:0.5} 50%{opacity:1} }
      .drawpath{stroke-dasharray:300;animation:draw 3s ease-in-out infinite alternate}
      .gl{animation:glow 2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="200" height="160" fill="#0d1520"/>
  <!-- Grid / sketch paper feel -->
  <g stroke="#3B8BD4" stroke-width="0.3" opacity="0.1">
    <line x1="0" y1="20" x2="200" y2="20"/>
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="140" x2="200" y2="140"/>
    <line x1="20" y1="0" x2="20" y2="160"/>
    <line x1="40" y1="0" x2="40" y2="160"/>
    <line x1="60" y1="0" x2="60" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="160"/>
    <line x1="120" y1="0" x2="120" y2="160"/>
    <line x1="140" y1="0" x2="140" y2="160"/>
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="180" y1="0" x2="180" y2="160"/>
  </g>
  <!-- Product sketch — isometric box -->
  <g opacity="0.9">
    <!-- Top face -->
    <polygon points="100,18 148,40 100,62 52,40" fill="#1e3560" stroke="#3B8BD4" stroke-width="1"/>
    <!-- Left face -->
    <polygon points="52,40 100,62 100,110 52,88" fill="#112040" stroke="#3B8BD4" stroke-width="1"/>
    <!-- Right face -->
    <polygon points="100,62 148,40 148,88 100,110" fill="#1a2e50" stroke="#3B8BD4" stroke-width="1"/>
  </g>
  <!-- Animated sketch outline -->
  <polyline class="drawpath" points="100,18 148,40 148,88 100,110 52,88 52,40 100,18" fill="none" stroke="#FF2D78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dimension arrows -->
  <line x1="155" y1="40" x2="155" y2="88" stroke="#FFD700" stroke-width="0.8" opacity="0.6"/>
  <line x1="152" y1="40" x2="158" y2="40" stroke="#FFD700" stroke-width="0.8" opacity="0.6"/>
  <line x1="152" y1="88" x2="158" y2="88" stroke="#FFD700" stroke-width="0.8" opacity="0.6"/>
  <text font-family="'Courier New',monospace" font-size="7" fill="#FFD700" x="158" y="68" opacity="0.7">48px</text>
  <!-- Highlight dot -->
  <circle class="gl" cx="100" cy="62" r="4" fill="#FF2D78"/>
  <!-- Color swatches bottom -->
  <rect x="20" y="122" width="14" height="14" rx="2" fill="#FF2D78"/>
  <rect x="40" y="122" width="14" height="14" rx="2" fill="#9B5CF6"/>
  <rect x="60" y="122" width="14" height="14" rx="2" fill="#3B8BD4"/>
  <rect x="80" y="122" width="14" height="14" rx="2" fill="#00C896"/>
  <rect x="100" y="122" width="14" height="14" rx="2" fill="#FF7A1A"/>
  <!-- Pencil icon -->
  <g opacity="0.7">
    <rect x="148" y="118" width="6" height="22" rx="2" transform="rotate(-30,151,129)" fill="#FFD700"/>
    <polygon points="148,136 154,136 151,142" transform="rotate(-30,151,129)" fill="#FF7A1A"/>
  </g>
  <!-- Label -->
  <text font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#ffffff" opacity="0.35" x="10" y="155" letter-spacing="1">PRODUCT DESIGN</text>
</svg>
